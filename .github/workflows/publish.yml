name: Build and publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.34'
      - name: Render all pages
        run: quarto render
      - name: Check website
        run: |
          python3 scripts/check_site.py
          git diff --exit-code -- research.qmd projects
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions: https://github.com/$GITHUB_REPOSITORY/settings/pages"
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: always() && needs.build.result == 'success' && (github.event_name == 'pull_request' || needs.deploy.result == 'success')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v6
      - name: Checkout currently published source for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: deployed-source
      - name: Verify public pages and assets
        env:
          SITE_URL: https://ricardoansantos.github.io/
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check_live_site.py "$SITE_URL" deployed-source
          else
            python3 scripts/check_live_site.py "$SITE_URL"
          fi
