name: Retrieve MEMELAND logo
on:
  push:
    branches: [memeland-role-logo-20261011]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Install image reader
        run: python3 -m pip install Pillow
      - name: Read original public logo
        run: |
          python3 - <<'PY'
          import base64
          import io
          import json
          from urllib.request import Request, urlopen
          from PIL import Image
          source = "https://memeland.no/en/Materials/Logos/MEMELAND.png"
          with urlopen(Request(source, headers={"User-Agent": "Mozilla/5.0"}), timeout=20) as response:
              data = response.read(5000001)
          if len(data) > 5000000:
              raise ValueError("Logo exceeds size limit")
          picture = Image.open(io.BytesIO(data))
          picture.load()
          if picture.format != "PNG" or min(picture.size) < 500:
              raise ValueError("Unexpected logo image")
          print("IMAGE_METADATA " + json.dumps({"source": source, "size": picture.size, "format": picture.format, "bytes": len(data)}))
          preview = picture.copy()
          preview.thumbnail((400, 400))
          output = io.BytesIO()
          preview.convert("RGB").save(output, format="JPEG", quality=85)
          print("IMAGE_PREVIEW " + base64.b64encode(output.getvalue()).decode())
          print("IMAGE_ORIGINAL " + base64.b64encode(data).decode())
          PY
