name: Inspect uploaded outreach cover
on:
  push:
    branches: [natgeo-cover-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploaded cover
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install image inspection dependency
        run: python3 -m pip install Pillow
      - name: Inspect uploaded JPEG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64
          import json
          path = Path("assets/493406316_24151734434427600_8590256346153145233_n.jpg")
          data = path.read_bytes()
          if len(data) > 1000000:
              raise ValueError("Unexpected image size")
          im = Image.open(BytesIO(data))
          if im.format != "JPEG":
              raise ValueError("Expected JPEG upload")
          im.load()
          print("COVER_METADATA " + json.dumps({"path": str(path), "bytes": len(data), "size": list(im.size), "format": im.format}), flush=True)
          im.thumbnail((640, 640))
          preview = BytesIO()
          im.convert("RGB").save(preview, format="JPEG", quality=85)
          print("COVER_PREVIEW " + base64.b64encode(preview.getvalue()).decode("ascii"), flush=True)
          PY
