name: Inspect public outreach image sources
on:
  push:
    branches: [outreach-cover-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect photographer portfolio and public image metadata
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import json
          class Images(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "img" or (tag == "meta" and a.get("property", a.get("name", "")) in {"og:image", "twitter:image"}):
                      print("SOURCE_IMAGE " + json.dumps(a), flush=True)
          urls = [
              "https://filipepatrocinio.com/",
              "https://filipepatrocinio.com/lagoa-do-peixao/",
              "https://filipepatrocinio.com/wp-json/wp/v2/media?search=peix&per_page=100",
              "https://filipepatrocinio.com/wp-json/wp/v2/media?search=national&per_page=100",
              "https://filipepatrocinio.com/wp-json/wp/v2/media?search=tempo&per_page=100",
          ]
          for url in urls:
              print("SOURCE_PAGE " + url, flush=True)
              try:
                  with urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=20) as response:
                      content = response.read(5000000).decode("utf-8")
                  if "/wp-json/" in url:
                      for item in json.loads(content):
                          print("SOURCE_MEDIA " + json.dumps({k:item.get(k) for k in ["id", "date", "slug", "title", "source_url", "media_details"]}), flush=True)
                  else:
                      Images().feed(content)
              except Exception as error:
                  print("SOURCE_ERROR " + str(error), flush=True)
          PY
